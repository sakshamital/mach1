# YOUR SENTINEL v8.0 — Render.com deployment
services:
  - type: web
    name: your-sentinel
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: |
      apt-get update && apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin || true
      pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: your-sentinel-db
          property: connectionString
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_SAFE_BROWSING_KEY
        sync: false
      - key: VIRUSTOTAL_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
    healthCheckPath: /health

databases:
  - name: your-sentinel-db
    plan: free
    databaseName: your_sentinel
    user: your_sentinel
